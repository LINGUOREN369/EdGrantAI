services:
  - type: web
    name: edgrantai-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn api.server:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: EDGRANT_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://linguoren.com"
